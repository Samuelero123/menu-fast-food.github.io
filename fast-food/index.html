<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurante Fast Food - Torres del Castillo</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <div class="background-foods" aria-hidden="true">
    <img src="assets/images/1.png" alt="">
    <img src="assets/images/2.png" alt="">
    <img src="assets/images/3.png" alt="">
    <img src="assets/images/4.png" alt="">
    <img src="assets/images/5.png" alt="">  
  </div>

  <header>
    <div class="logo-container">
      <img src="assets/images/logo1.png" alt="Fast Food Logo" id="header-logo">
    </div>
    <h1>Restaurante Fast Food</h1>
    <p class="subtitle">Torres del Castillo • San Gil</p>
  </header>

  <nav class="categories-nav">
    <button class="cat-btn active" onclick="filterCategory('all')">Todos</button>
    <button class="cat-btn" onclick="filterCategory('burguer')">Burguer's</button>
    <button class="cat-btn" onclick="filterCategory('perros')">Perros</button>
    <button class="cat-btn" onclick="filterCategory('salchipapas')">Salchipapas</button>
    <button class="cat-btn" onclick="filterCategory('picadas')">Picadas</button>
    <button class="cat-btn" onclick="filterCategory('sandwich')">Sandwich's</button>
    <button class="cat-btn" onclick="filterCategory('tacos')">Tacos</button>
    <button class="cat-btn" onclick="filterCategory('alitas')">Alitas</button>
    <button class="cat-btn" onclick="filterCategory('adicionales')">Adicionales</button>
    <a class="cat-btn user-link" href="admin.html">Usuario</a>
  </nav>

  <div class="container" id="menu-container"></div>

  <button class="cart-toggle" id="cart-toggle" type="button" aria-label="Abrir carrito">
    <span class="cart-icon" aria-hidden="true">🛒</span>
    <span>Mi carrito</span>
    <strong id="cart-count">0</strong>
  </button>

  <div class="cart-overlay" id="cart-overlay" aria-hidden="true">
    <aside class="cart-drawer" role="dialog" aria-modal="true" aria-labelledby="cart-title">
      <div class="cart-header">
        <div>
          <p class="cart-eyebrow">Tu pedido</p>
          <h2 id="cart-title">Mi carrito</h2>
        </div>
        <button class="cart-close" id="cart-close" type="button" aria-label="Cerrar carrito">&times;</button>
      </div>
      <div class="cart-items" id="cart-items"></div>
      <div class="cart-empty" id="cart-empty">
        <span class="cart-empty-icon" aria-hidden="true">🍔</span>
        <p>Tu carrito está vacío</p>
        <small>Toca una comida para comenzar tu pedido.</small>
      </div>
      <div class="cart-summary">
        <div><span>Total estimado</span><strong id="cart-total">COP 0</strong></div>
        <button class="cart-order-button" id="cart-order-button" type="button" disabled>Solicitar pedido</button>
        <p class="cart-note">El valor de los productos con precio por consultar se confirma al ordenar.</p>
      </div>
    </aside>
  </div>

  <!-- MODAL INTERACTIVO -->
  <div class="modal-overlay" id="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-logo">
        <img src="assets/images/logo1.png" alt="Fast Food Logo" id="modal-logo-img">
      </div>
      <img class="modal-food-image" id="modal-food-image" alt="" hidden>
      <h3 class="modal-title" id="modal-title"></h3>
      <div class="modal-price" id="modal-price"></div>
      <div class="modal-ingredients-label">Ingredientes y Detalles</div>
      <p class="modal-desc" id="modal-desc"></p>
      <button class="btn-add-more" id="modal-add-button" type="button">Agregar otra unidad</button>
      <button class="btn-close" onclick="closeModal()">Cerrar</button>
    </div>
  </div>

  <script src="assets/js/script.js"></script>
</body>
</html>
